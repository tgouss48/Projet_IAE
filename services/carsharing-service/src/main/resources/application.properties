spring.application.name=carsharing-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carsharing}
spring.datasource.username=${DB_USER:carsharing}
spring.datasource.password=${DB_PASSWORD:carsharing}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# meme duree de maintien que les partenaires
carsharing.hold-ttl=PT10M
carsharing.expiry-check-ms=60000

management.endpoints.web.exposure.include=health,info
