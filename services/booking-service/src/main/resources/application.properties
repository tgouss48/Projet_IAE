spring.application.name=booking-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:booking}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=booking-saga
spring.kafka.consumer.auto-offset-reset=earliest

booking.topic=booking-events
booking.pricing-url=${PRICING_URL:http://pricing-service:8080}
booking.providers.TRAIN=${RAIL_BRIDGE_URL:http://rail-bridge:8080}
booking.providers.FLIGHT=${AIR_BRIDGE_URL:http://air-bridge:8080}
booking.providers.CARSHARING=${CARSHARING_URL:http://carsharing-service:8080}
booking.connect-timeout-ms=3000
booking.read-timeout-ms=10000

# les holds expirent a 10 min chez les operateurs : on ne confirme plus apres 9 min
booking.saga.hold-window=PT9M
booking.saga.cancel-attempts=3
booking.saga.retry-enabled=true
booking.saga.retry-delay-ms=30000
booking.outbox.enabled=true
booking.outbox.poll-ms=500

management.endpoints.web.exposure.include=health,info
