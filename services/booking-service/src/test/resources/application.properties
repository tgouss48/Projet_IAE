spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:1
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false

booking.topic=booking-events
booking.pricing-url=http://localhost:1
booking.providers.TRAIN=http://localhost:1
booking.providers.FLIGHT=http://localhost:1
booking.providers.CARSHARING=http://localhost:1
booking.connect-timeout-ms=100
booking.read-timeout-ms=100
booking.saga.hold-window=PT9M
booking.saga.cancel-attempts=3
booking.saga.retry-enabled=false
booking.saga.retry-delay-ms=30000
booking.outbox.enabled=false
booking.outbox.poll-ms=500
