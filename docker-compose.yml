# =====================================================================
#  Starter kit — Plateforme de mobilité multimodale
#  Démarre les DEUX systèmes partenaires "legacy" (fournis, non modifiables).
#  Les étudiants ajoutent LEURS services (microservices, bridges, BFF…)
#  sur le même réseau "mobilite-net".
#
#  Lancement :  docker compose up --build
#
#  Encadrement : Pr. Mahmoud NASSAR
# =====================================================================
services:

  # --- Opérateur ferroviaire : serveur CORBA (JacORB) ---
  rail:
    build: ./rail-operator-corba
    image: mobilite/rail-operator-corba:1.0.0
    container_name: rail-operator-corba
    environment:
      # Hôte annoncé dans l'IOR. Pour un bridge tournant DANS ce réseau,
      # laisser "rail". Pour un bridge tournant sur l'hôte, mettre "localhost".
      CORBA_ADVERTISED_HOST: rail
      CORBA_PORT: "1050"
      IOR_FILE: /ior/RailBooking.ior
    ports:
      - "1050:1050"          # IIOP, publié sur l'hôte
    volumes:
      - ./ior:/ior           # le fichier IOR apparaît côté hôte dans ./ior/

  # --- Partenaire aérien : service SOAP (Spring WS) ---
  air:
    build: ./air-partner-soap
    image: mobilite/air-partner-soap:1.0.0
    container_name: air-partner-soap
    ports:
      - "8081:8080"          # WSDL: http://localhost:8081/ws/air.wsdl

  # ===================== Plateforme (equipe) =====================

  # --- Bridge CORBA -> REST ---
  rail-bridge:
    build: ./bridges/rail-bridge
    image: mobilite/rail-bridge:0.1.0
    container_name: rail-bridge
    environment:
      IOR_FILE: /ior/RailBooking.ior
    volumes:
      - ./ior:/ior:ro
    ports:
      - "8091:8080"
    depends_on:
      - rail

  # --- Bridge SOAP -> REST ---
  air-bridge:
    build: ./bridges/air-bridge
    image: mobilite/air-bridge:0.1.0
    container_name: air-bridge
    environment:
      AIR_URL: http://air:8080/ws
    ports:
      - "8092:8080"
    depends_on:
      - air

  # --- Microservice autopartage + sa base ---
  carsharing-db:
    image: postgres:15-alpine
    container_name: carsharing-db
    environment:
      POSTGRES_DB: carsharing
      POSTGRES_USER: carsharing
      POSTGRES_PASSWORD: carsharing
    volumes:
      - carsharing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsharing -d carsharing"]
      interval: 5s
      retries: 10

  carsharing-service:
    build: ./services/carsharing-service
    image: mobilite/carsharing-service:0.1.0
    container_name: carsharing-service
    environment:
      DB_URL: jdbc:postgresql://carsharing-db:5432/carsharing
      DB_USER: carsharing
      DB_PASSWORD: carsharing
    ports:
      - "8093:8080"
    depends_on:
      carsharing-db:
        condition: service_healthy

  # --- Microservice tarification + sa base ---
  pricing-db:
    image: postgres:15-alpine
    container_name: pricing-db
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    volumes:
      - pricing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 5s
      retries: 10

  pricing-service:
    build: ./services/pricing-service
    image: mobilite/pricing-service:0.1.0
    container_name: pricing-service
    environment:
      DB_URL: jdbc:postgresql://pricing-db:5432/pricing
      DB_USER: pricing
      DB_PASSWORD: pricing
    ports:
      - "8094:8080"
    depends_on:
      pricing-db:
        condition: service_healthy

volumes:
  carsharing-data:
  pricing-data:

networks:
  default:
    name: mobilite-net
