# =====================================================================
#  Starter kit — Plateforme de mobilité multimodale
#  Démarre les DEUX systèmes partenaires "legacy" (fournis, non modifiables).
#  Les étudiants ajoutent LEURS services (microservices, bridges, BFF…)
#  sur le même réseau "mobilite-net".
#
#  Lancement :  docker compose up --build
#
#  Encadrement : Pr. Mahmoud NASSAR
# =====================================================================
services:

  # --- Opérateur ferroviaire : serveur CORBA (JacORB) ---
  rail:
    build: ./rail-operator-corba
    image: mobilite/rail-operator-corba:1.0.0
    container_name: rail-operator-corba
    environment:
      # Hôte annoncé dans l'IOR. Pour un bridge tournant DANS ce réseau,
      # laisser "rail". Pour un bridge tournant sur l'hôte, mettre "localhost".
      CORBA_ADVERTISED_HOST: rail
      CORBA_PORT: "1050"
      IOR_FILE: /ior/RailBooking.ior
    ports:
      - "1050:1050"          # IIOP, publié sur l'hôte
    volumes:
      - ./ior:/ior           # le fichier IOR apparaît côté hôte dans ./ior/

  # --- Partenaire aérien : service SOAP (Spring WS) ---
  air:
    build: ./air-partner-soap
    image: mobilite/air-partner-soap:1.0.0
    container_name: air-partner-soap
    ports:
      - "8081:8080"          # WSDL: http://localhost:8081/ws/air.wsdl

  # ===================== Plateforme (equipe) =====================

  # --- Bridge CORBA -> REST ---
  rail-bridge:
    build: ./bridges/rail-bridge
    image: mobilite/rail-bridge:0.1.0
    container_name: rail-bridge
    environment:
      IOR_FILE: /ior/RailBooking.ior
    volumes:
      - ./ior:/ior:ro
    ports:
      - "8091:8080"
    depends_on:
      - rail

  # --- Bridge SOAP -> REST ---
  air-bridge:
    build: ./bridges/air-bridge
    image: mobilite/air-bridge:0.1.0
    container_name: air-bridge
    environment:
      AIR_URL: http://air:8080/ws
    ports:
      - "8092:8080"
    depends_on:
      - air

  # --- Microservice autopartage + sa base ---
  carsharing-db:
    image: postgres:15-alpine
    container_name: carsharing-db
    environment:
      POSTGRES_DB: carsharing
      POSTGRES_USER: carsharing
      POSTGRES_PASSWORD: carsharing
    volumes:
      - carsharing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsharing -d carsharing"]
      interval: 5s
      retries: 10

  carsharing-service:
    build: ./services/carsharing-service
    image: mobilite/carsharing-service:0.1.0
    container_name: carsharing-service
    environment:
      DB_URL: jdbc:postgresql://carsharing-db:5432/carsharing
      DB_USER: carsharing
      DB_PASSWORD: carsharing
    ports:
      - "8093:8080"
    depends_on:
      carsharing-db:
        condition: service_healthy

  # --- Microservice tarification + sa base ---
  pricing-db:
    image: postgres:15-alpine
    container_name: pricing-db
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    volumes:
      - pricing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 5s
      retries: 10

  pricing-service:
    build: ./services/pricing-service
    image: mobilite/pricing-service:0.1.0
    container_name: pricing-service
    environment:
      DB_URL: jdbc:postgresql://pricing-db:5432/pricing
      DB_USER: pricing
      DB_PASSWORD: pricing
    ports:
      - "8094:8080"
    depends_on:
      pricing-db:
        condition: service_healthy

  # --- Bus d'evenements (Kafka en mode KRaft, sans Zookeeper) ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12

  # --- Microservice reservations (orchestrateur de saga) + sa base ---
  booking-db:
    image: postgres:15-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      retries: 10

  booking-service:
    build: ./services/booking-service
    image: mobilite/booking-service:0.1.0
    container_name: booking-service
    environment:
      DB_URL: jdbc:postgresql://booking-db:5432/booking
      DB_USER: booking
      DB_PASSWORD: booking
      KAFKA_BOOTSTRAP: kafka:9092
      PRICING_URL: http://pricing-service:8080
      RAIL_BRIDGE_URL: http://rail-bridge:8080
      AIR_BRIDGE_URL: http://air-bridge:8080
      CARSHARING_URL: http://carsharing-service:8080
    ports:
      - "8095:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # --- API Gateway / BFF : seul point d'entree du client ---
  gateway:
    build: ./gateway
    image: mobilite/gateway:0.1.0
    container_name: gateway
    environment:
      JWT_SECRET: mobilite-secret-de-demo-0123456789abcdef
      RAIL_BRIDGE_URL: http://rail-bridge:8080
      AIR_BRIDGE_URL: http://air-bridge:8080
      CARSHARING_URL: http://carsharing-service:8080
      PRICING_URL: http://pricing-service:8080
      BOOKING_URL: http://booking-service:8080
    ports:
      - "8080:8080"
    depends_on:
      - booking-service
      - rail-bridge
      - air-bridge
      - carsharing-service
      - pricing-service

volumes:
  carsharing-data:
  pricing-data:
  booking-data:

networks:
  default:
    name: mobilite-net
